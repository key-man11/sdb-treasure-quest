
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>SDB Treasure Quest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #101e39, #253e65);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      color: #f6d47c;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .treasure {
      font-size: 100px;
      margin: 45px 0 25px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.3;
      margin-bottom: 15px;
    }

    .description {
      color: #c7d5ec;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .start-button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: #f6c85f;
      color: #17243d;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .notice {
      margin-top: 25px;
      color: #aabbd5;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">SDB TREASURE QUEST</div>

    <div class="treasure">🎁</div>

    <h1>
      우리 회사에 숨겨진<br>
      보물을 찾아라!
    </h1>

    <p class="description">
      회사 곳곳에 숨겨진 보물을 발견하고<br>
      미션을 해결해 코인을 획득하세요.
    </p>

    <button class="start-button" id="startButton">
      탐험 시작하기
    </button>

    <p class="notice">
      SDB AR TREASURE HUNT · TEST VERSION
    </p>
  </main>

  <script>
    document.getElementById("startButton")
      .addEventListener("click", function () {
        alert("다음 단계에서 참여자 인증 기능을 연결합니다.");
      });
  </script>
</body>
</html>
